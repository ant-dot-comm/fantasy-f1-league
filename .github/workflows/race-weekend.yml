name: Race weekend automation

# MANUAL-ONLY. The scheduled trigger is intentionally disabled: GitHub throttles
# free scheduled workflows to every few hours, so the reliable hourly trigger is
# now the Claude cloud routine "Fantasy F1 — race-weekend dispatch (reliable)",
# which calls /api/automation/dispatch. This workflow is kept for manual/emergency
# runs of the full pipeline in-repo: Actions tab → Run workflow, or
# `gh workflow run race-weekend.yml` (runs immediately, not throttled).
on:
  # schedule:                # disabled — see note above (GitHub throttles it)
  #   - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        required: false
        default: "2026"

# Never let two runs overlap (e.g. a manual run during a scheduled one).
concurrency:
  group: race-weekend
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run race-weekend dispatcher
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: node scripts/dispatchRaceWeekend.mjs
