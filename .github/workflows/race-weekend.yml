name: Race weekend automation

# Runs the race-weekend scripts automatically. The dispatcher reads
# data/raceSchedule.js + the current time to decide what (if anything) is due,
# so this can run harmlessly year-round — it no-ops outside race windows.
on:
  schedule:
    # Every 20 minutes (UTC). Frequent enough to catch late qualifying penalties
    # while picks are open and re-fix affected picks. GitHub may delay scheduled
    # runs a few minutes under load, so 20 min is a target, not a guarantee.
    - cron: "*/20 * * * *"
  # Lets you trigger a run by hand from the Actions tab (useful for testing).
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        required: false
        default: "2026"

# Never let two runs overlap (e.g. a manual run during a scheduled one).
concurrency:
  group: race-weekend
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run race-weekend dispatcher
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: node scripts/dispatchRaceWeekend.mjs
